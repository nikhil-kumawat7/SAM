AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Strength & Hypertrophy Tracker API
  
  Knowledge Management (KM) API Core - Epic 1
  
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Runtime: python3.9
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref ExercisesTable

Resources:
  ExercisesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ExercisesTable-${AWS::StackName}"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: target_muscle
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TargetMuscleIndex
          KeySchema:
            - AttributeName: target_muscle
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  CreateExerciseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.create_exercise
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExercisesTable
      Events:
        CreateExerciseApi:
          Type: Api
          Properties:
            Path: /api/exercises
            Method: post

  GetExercisesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.get_exercises
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExercisesTable
      Events:
        GetExercisesApi:
          Type: Api
          Properties:
            Path: /api/exercises
            Method: get

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/exercises"
